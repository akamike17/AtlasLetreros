<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor · Atlas Letrero</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/editor.css"></head><body class="editor-body"><header id="navigation" class="topbar"></header><main class="editor-workspace"><div class="editor-toolbar"><h1 id="project-name">Editor</h1><button id="save" class="primary">Guardar</button><button id="undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button><button id="redo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">↷</button><button id="export">Exportar</button><label><span>Escena</span><select id="scene-select"></select></label><button id="scene-new" title="Nueva escena">+ Escena</button><button id="scene-duplicate">Duplicar escena</button><button id="scene-active">✓ Activa</button><button id="scene-delete">Eliminar escena</button></div><div class="workspace-main"><aside class="toolbox"><h3>Herramientas</h3><div id="tools" class="tools"></div><label><span>Color</span><input type="color" id="color" value="#36e6b0"></label><label><span>Brillo <output id="brightness-value">80%</output></span><input id="brightness" type="range" min="1" max="100" value="80"></label></aside><section class="canvas-panel"><div class="canvas-heading"><span id="canvas-title">CANVAS LED</span><div class="actions"><label><input type="checkbox" id="grid" checked> Cuadrícula</label><label>Zoom <input id="zoom" type="range" min="0.5" max="3" step="0.1" value="1"></label></div></div><div class="canvas-host"><canvas id="editor-canvas" aria-label="Canvas LED de diseño"></canvas></div><div class="canvas-footer"><span id="tool-hint">Selecciona o arrastra un objeto</span><span id="matrix-size"></span></div></section><aside class="sidebar"><section class="panel simulator"><h3>Simulador local</h3><div class="simulator-host"><canvas id="simulator-canvas" aria-label="Simulador LED local"></canvas></div><div class="simulator-bottom"><span id="simulator-info"></span><label title="Zoom del simulador"><input type="range" id="simulator-zoom" min="0.5" max="2" step="0.1" value="1" aria-label="Zoom del simulador"></label></div></section><section class="panel inspector"><h3>Inspector</h3><div id="inspector"></div></section><section class="panel destination"><h3>Destino</h3><div class="destination-row"><select id="destination" aria-label="Destino"><option value="simulator">Simulador local</option><option value="serial" disabled>ESP32 USB/Serial</option></select><button id="send" class="primary">Enviar</button><button id="cancel-send" disabled title="Cancelar envío">×</button></div><div class="device-line"><span id="destination-device">○ Sin dispositivo</span><button id="detect-device">Detectar / Elegir</button></div></section></aside></div><section class="layers-panel"><div class="strip-heading"><h3>Capas / Objetos</h3><div class="actions"><button id="layer-new">+ Capa</button><button id="layer-duplicate">Duplicar</button><button id="layer-up" title="Subir">↑</button><button id="layer-down" title="Bajar">↓</button><button id="layer-delete">Eliminar</button></div></div><div id="layers" class="layers-list"></div></section><section class="timeline-panel"><div class="timeline-top"><h3 style="margin:0 15px 0 0">Animación</h3><button id="first" aria-label="Inicio">|◀</button><button id="previous" aria-label="Anterior">◀</button><button id="play" aria-label="Reproducir">▶</button><button id="stop" aria-label="Detener">■</button><button id="next" aria-label="Siguiente">▶|</button><button id="last" aria-label="Final">▶▶|</button><label><input type="checkbox" id="loop" checked>Repetir</label><label>FPS<input type="number" id="fps" min="1" max="60" value="12"></label><span class="time" id="time">00:00.000 / 00:01.000</span></div><div id="frames" class="frames"></div><div class="timeline-controls"><button id="frame-new">+ Frame</button><button id="frame-duplicate">Duplicar frame</button><button id="frame-delete">Eliminar frame</button><button id="frame-left" title="Mover frame a la izquierda">←</button><button id="frame-right" title="Mover frame a la derecha">→</button><label>Duración<input type="number" id="frame-duration" min="16" max="60000" value="1000">ms</label></div></section><footer class="editor-status"><span id="status" class="status" role="status">Listo</span><span id="save-state">Guardado</span></footer></main><script type="module" src="/js/editor/editor-app.js"></script></body></html>
