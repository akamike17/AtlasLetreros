name: Atlas Letrero CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20.x' }
      - run: npm test
      - run: powershell -ExecutionPolicy Bypass -File tools/verify-assets.ps1
      - run: dotnet restore tests/AtlasLetrero.E2E/AtlasLetrero.E2E.csproj
      - run: dotnet build tests/AtlasLetrero.E2E/AtlasLetrero.E2E.csproj -c Release --no-restore
      - run: pwsh tests/AtlasLetrero.E2E/bin/Release/net8.0/playwright.ps1 install chromium
      - run: powershell -ExecutionPolicy Bypass -File tools/smoke.ps1
