name: Atlas Letrero CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20.x' }
      - run: npm test
      - run: dotnet restore src/AtlasLetrero.App/AtlasLetrero.App.csproj
      - run: dotnet restore tests/AtlasLetrero.E2E/AtlasLetrero.E2E.csproj
      - run: dotnet build src/AtlasLetrero.App/AtlasLetrero.App.csproj -c Release --no-restore
      - run: dotnet build tests/AtlasLetrero.E2E/AtlasLetrero.E2E.csproj -c Release --no-restore
